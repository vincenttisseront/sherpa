# Fichiers montés en secrets Docker, lisibles par le seul UID du Runner. Aucune valeur affichée.
- name: Répertoires du Runner
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: ["{{ runner_dir }}", "{{ runner_dir }}/secrets"]

- name: Certificat serveur, clé et AC des clients
  ansible.builtin.copy:
    src: "{{ omit if item.content | length > 0 else item.src }}"
    content: "{{ (item.content | trim ~ '\n') if item.content | length > 0 else omit }}"
    dest: "{{ runner_dir }}/secrets/{{ item.dest }}"
    owner: "{{ runner_uid }}"
    group: "{{ runner_gid }}"
    mode: "0400"
  loop:
    - { src: "{{ runner_tls_cert_file }}", content: "{{ runner_tls_cert }}", dest: runner.crt }
    - { src: "{{ runner_tls_key_file }}", content: "{{ runner_tls_key }}", dest: runner.key }
    - { src: "{{ runner_client_ca_file }}", content: "{{ runner_client_ca }}", dest: platform-ca.crt }
  loop_control:
    label: "{{ item.dest }}"
  register: runner_certs
  no_log: true

- name: Clé HMAC (fournie par la console à l'enregistrement)
  ansible.builtin.copy:
    content: "{{ runner_hmac_key | trim }}\n"
    dest: "{{ runner_dir }}/secrets/hmac.key"
    owner: "{{ runner_uid }}"
    group: "{{ runner_gid }}"
    mode: "0400"
  register: runner_hmac
  when: runner_hmac_key | length > 0
  no_log: true

- name: Empreinte de la clé HMAC (à comparer à celle affichée par la console)
  ansible.builtin.shell:
    cmd: "set -o pipefail; tr -d '\\n' < {{ (runner_dir ~ '/secrets/hmac.key') | quote }} | sha256sum | cut -c1-16"
    executable: /bin/bash
  register: runner_hmac_fingerprint
  changed_when: false
  when: runner_hmac_key | length > 0

- name: Secrets modifiés (Runner à recréer)
  ansible.builtin.set_fact:
    runner_secrets_changed: "{{ runner_certs.changed or (runner_hmac.changed | default(false)) }}"
