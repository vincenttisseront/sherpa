- name: Identité mTLS fournie ?
  ansible.builtin.set_fact:
    platform_runner_mtls: "{{ (platform_runner_client_cert ~ platform_runner_client_cert_file) | length > 0 }}"

# Secrets de la console : fichiers montés en secrets Docker, jamais en variables d'environnement.
# - Fournis (ansible-vault) : écrits s'ils manquent ; un fichier existant DIFFÉRENT arrête le
#   déploiement (clé maîtresse ou mots de passe changés par erreur = données illisibles).
# - Non fournis : générés sur l'hôte au premier déploiement, jamais régénérés.
# Aucune valeur n'apparaît dans la sortie d'Ansible (no_log).

- name: Secrets fournis inchangés sur l'hôte
  ansible.builtin.copy:
    content: "{{ item.value | trim }}\n"
    dest: "{{ platform_dir }}/secrets/{{ item.name }}"
    owner: root
    group: root
    mode: "0444"
  check_mode: true
  register: platform_secret_diff
  loop:
    - { name: master_key, value: "{{ platform_master_key }}" }
    - { name: db_password, value: "{{ platform_db_password }}" }
    - { name: redis_password, value: "{{ platform_redis_password }}" }
  loop_control:
    label: "{{ item.name }}"
  when: item.value | length > 0
  no_log: true

- name: Fichiers secrets présents sur l'hôte
  ansible.builtin.stat:
    path: "{{ platform_dir }}/secrets/{{ item }}"
  register: platform_secret_stat
  loop: [master_key, db_password, redis_password]

- name: Refus de remplacer un secret existant
  ansible.builtin.assert:
    that: not (item.changed | default(false) and (platform_secret_stat.results | selectattr('item', 'equalto', item.item.name) | first).stat.exists)
    fail_msg: >-
      {{ item.item.name }} : la valeur fournie diffère de celle de l'hôte. Une autre clé maîtresse rend les
      secrets chiffrés illisibles, un autre mot de passe ne s'applique pas à la base existante.
      Rotation : voir docs/securite.md.
    quiet: true
  loop: "{{ platform_secret_diff.results | selectattr('changed', 'defined') | list }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Secrets fournis (ansible-vault)
  ansible.builtin.copy:
    content: "{{ item.value | trim }}\n"
    dest: "{{ platform_dir }}/secrets/{{ item.name }}"
    owner: root
    group: root
    mode: "0444"
    force: false
  loop:
    - { name: master_key, value: "{{ platform_master_key }}" }
    - { name: db_password, value: "{{ platform_db_password }}" }
    - { name: redis_password, value: "{{ platform_redis_password }}" }
  loop_control:
    label: "{{ item.name }}"
  when: item.value | length > 0
  no_log: true

- name: Secrets générés sur l'hôte (premier déploiement)
  ansible.builtin.shell:
    cmd: "umask 077 && openssl rand {{ item.args }} > {{ item.name }}.tmp && chmod 0444 {{ item.name }}.tmp && mv {{ item.name }}.tmp {{ item.name }}"
    chdir: "{{ platform_dir }}/secrets"
    creates: "{{ platform_dir }}/secrets/{{ item.name }}"
  loop:
    - { name: master_key, args: "-base64 32" }
    - { name: db_password, args: "-hex 24" }
    - { name: redis_password, args: "-hex 24" }
  loop_control:
    label: "{{ item.name }}"

- name: Secrets modifiables (clés précédentes, SMTP)
  ansible.builtin.copy:
    content: "{{ (item.value | trim ~ '\n') if item.value | length > 0 else '' }}"
    dest: "{{ platform_dir }}/secrets/{{ item.name }}"
    owner: root
    group: root
    mode: "0444"
  loop:
    - { name: master_keys_previous, value: "{{ platform_master_keys_previous }}" }
    - { name: smtp_password, value: "{{ platform_smtp_password }}" }
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Identité mTLS de la console vers les Runners
  ansible.builtin.copy:
    src: "{{ omit if item.content | length > 0 else item.src }}"
    content: "{{ (item.content | trim ~ '\n') if item.content | length > 0 else omit }}"
    dest: "{{ platform_dir }}/secrets/{{ item.dest }}"
    owner: root
    group: root
    mode: "0444"
  loop:
    - { src: "{{ platform_runner_client_cert_file }}", content: "{{ platform_runner_client_cert }}", dest: runner-client.crt }
    - { src: "{{ platform_runner_client_key_file }}", content: "{{ platform_runner_client_key }}", dest: runner-client.key }
  loop_control:
    label: "{{ item.dest }}"
  when: platform_runner_mtls
  no_log: true

- name: Identité mTLS absente (fichiers vides, Runners indisponibles)
  ansible.builtin.copy:
    content: ""
    dest: "{{ platform_dir }}/secrets/{{ item }}"
    owner: root
    group: root
    mode: "0444"
    force: false
  loop: [runner-client.crt, runner-client.key]
  when: not platform_runner_mtls

- name: Avertissement Runners
  ansible.builtin.debug:
    msg: "Aucune identité mTLS fournie (platform_runner_client_cert_file / _key_file) : les Target Runners ne seront pas joignables (docs/runner.md)."
  when: not platform_runner_mtls
