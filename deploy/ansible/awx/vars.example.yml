# Copier en vars.yml (non versionné) ; les valeurs secrètes en ansible-vault (vault.yml).
awx_organization: Default
awx_execution_environment: Default execution environment
awx_project_name: sherpa
awx_scm_url: https://github.com/vti_ibf/sherpa.git
awx_scm_branch: main
awx_github_user: vti_ibf
awx_ssh_user: admin
awx_ssh_key_file: ~/.ssh/awx_deploy_ed25519     # clé privée du compte de déploiement (lue localement, jamais affichée)
# Lancé DANS AWX : identifiants créés à la main dans AWX, ce playbook ne fait que les référencer.
# awx_manage_credentials: false

# Inventaire géré dans AWX : groupes platform (console) et runners (hôtes cibles).
awx_inventory_name: Sherpa
awx_hosts:
  platform:
    deploy-console:
      ansible_host: 10.0.0.10
  runners:
    app-01:
      ansible_host: 10.0.1.21
      runner_bind_ip: 10.0.1.21
      runner_tls_cert_file: /runner/pki/app-01.crt   # chemin dans l'environnement d'exécution, voir README
      runner_tls_key_file: /runner/pki/app-01.key
awx_group_vars:
  platform:
    ansible_become: true
    platform_domain: deploy.interne.example
    platform_image_source: build
    platform_expose: traefik
  runners:
    ansible_become: true
    runner_image_source: build

# Secrets (vault.yml chiffré) :
# awx_github_token:   jeton GitHub (lecture du dépôt)
# awx_vault_password: mot de passe ansible-vault des variables chiffrées (clé HMAC des Runners, clé maîtresse…)
