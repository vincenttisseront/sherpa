# Analyse automatique de SonarQube Cloud (sonarcloud.io, projet vincenttisseront_sherpa).
# Seuls les réglages de périmètre sont pris en compte ici ; les exclusions par règle se configurent
# dans l'interface du projet (Administration > General Settings > Analysis Scope).

sonar.sources=.

# Migrations générées par drizzle-kit et jamais retouchées une fois appliquées.
sonar.exclusions=server/db/migrations/**

# Tests unitaires, d'intégration et de bout en bout : analysés comme du code de test.
sonar.test.inclusions=test/**,e2e/**
sonar.cpd.exclusions=test/**,e2e/**
